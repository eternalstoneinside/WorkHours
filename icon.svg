<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 192 192">
  <!-- Background -->
  <rect width="192" height="192" fill="#0b0f1a" rx="40"/>
  
  <!-- Gradient Definition -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#38bdf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#06b6d4;stop-opacity:1" />
    </linearGradient>
    
    <linearGradient id="grad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#fbbf24;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#f59e0b;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Left side - Calendar -->
  <g transform="translate(34, 64)">
    <!-- Calendar background -->
    <rect x="0" y="0" width="55" height="65" fill="url(#grad1)" rx="8" opacity="0.9"/>
    
    <!-- Calendar grid -->
    <g stroke="#0b0f1a" stroke-width="1.5">
      <!-- Days row -->
      <rect x="4" y="4" width="47" height="12" fill="none" rx="2"/>
      <line x1="11" y1="4" x2="11" y2="16"/>
      <line x1="18" y1="4" x2="18" y2="16"/>
      <line x1="25" y1="4" x2="25" y2="16"/>
      <line x1="32" y1="4" x2="32" y2="16"/>
      <line x1="39" y1="4" x2="39" y2="16"/>
      <line x1="46" y1="4" x2="46" y2="16"/>
      
      <!-- Dates -->
      <rect x="4" y="18" width="47" height="43" fill="none" rx="2"/>
      <line x1="4" y1="26" x2="51" y2="26"/>
      <line x1="4" y1="34" x2="51" y2="34"/>
      <line x1="4" y1="42" x2="51" y2="42"/>
      <line x1="4" y1="50" x2="51" y2="50"/>
      
      <line x1="11" y1="18" x2="11" y2="61"/>
      <line x1="18" y1="18" x2="18" y2="61"/>
      <line x1="25" y1="18" x2="25" y2="61"/>
      <line x1="32" y1="18" x2="32" y2="61"/>
      <line x1="39" y1="18" x2="39" y2="61"/>
      <line x1="46" y1="18" x2="46" y2="61"/>
    </g>
    
    <!-- Highlight date -->
    <circle cx="32" cy="42" r="5" fill="#0b0f1a" opacity="0.8"/>
  </g>
  
  <!-- Right side - Clock -->
  <g transform="translate(99, 64)">
    <!-- Clock circle -->
    <circle cx="27" cy="32" r="32" fill="url(#grad2)" opacity="0.9"/>
    
    <!-- Clock face -->
    <circle cx="27" cy="32" r="28" fill="none" stroke="#0b0f1a" stroke-width="1"/>
    
    <!-- Hour markers -->
    <g stroke="#0b0f1a" stroke-width="1.5">
      <line x1="27" y1="6" x2="27" y2="10"/>
      <line x1="48" y1="32" x2="52" y2="32"/>
      <line x1="27" y1="58" x2="27" y2="54"/>
      <line x1="6" y1="32" x2="2" y2="32"/>
    </g>
    
    <!-- Hour hand -->
    <line x1="27" y1="32" x2="27" y2="16" stroke="#0b0f1a" stroke-width="2" stroke-linecap="round"/>
    
    <!-- Minute hand -->
    <line x1="27" y1="32" x2="42" y2="32" stroke="#0b0f1a" stroke-width="1.5" stroke-linecap="round"/>
    
    <!-- Center dot -->
    <circle cx="27" cy="32" r="2" fill="#0b0f1a"/>
  </g>
</svg>